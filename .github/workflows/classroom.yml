name: Autograding Tests
on:
  push:
  repository_dispatch:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake g++
    - name: Build Project
      id: build-project
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Build Project
        setup-command: mkdir -p build && cd build && cmake .. && make
        command: echo "Build completed successfully"
        timeout: 5
        max-score: 10
    - name: Run All Tests
      id: run-all-tests
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Run All Tests
        setup-command: cd build
        command: ./tests
        timeout: 2
        max-score: 90
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        BUILD-PROJECT_RESULTS: "${{steps.build-project.outputs.result}}"
        RUN-ALL-TESTS_RESULTS: "${{steps.run-all-tests.outputs.result}}"
      with:
        runners: build-project,run-all-tests